name: CI – Build & Test

on:
  push:
    branches: ["Lab-03"]
  workflow_dispatch:          # allow manual runs from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # cancel older runs on the same branch

jobs:
  # -----------------------------------------------------------------------
  # Job 1 – API Tests (no browser needed; fast, fully parallelised)
  # -----------------------------------------------------------------------
  api-tests:
    name: API Tests (JSONPlaceholder)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run API tests
        run: |
          mvn --batch-mode test \
            -Dtest="com.ecommerce.tests.api.*" \
            -DfailIfNoTests=false

      # Publish JUnit XML → GitHub "Tests" tab summary
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: target/surefire-reports/TEST-*.xml
          check_name: "API Test Results"
          comment_mode: always

      # Upload ExtentReports HTML + Surefire XML as downloadable artefacts
      - name: Upload ExtentReports HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-extent-report
          path: target/api-reports/
          retention-days: 14

      - name: Upload Surefire XML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-surefire-xml
          path: target/surefire-reports/
          retention-days: 14

  # -----------------------------------------------------------------------
  # Job 2 – UI Tests (requires a real browser; runs on ubuntu with Xvfb)
  # -----------------------------------------------------------------------
  ui-tests:
    name: UI Tests (Selenium / Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run UI tests (headless Chrome via WebDriverManager)
        run: |
          mvn --batch-mode test \
            -Dtest="com.ecommerce.tests.LoginTest" \
            -DfailIfNoTests=false
        env:
          # Tell Selenium/WebDriverManager to run headless
          CHROME_OPTIONS: "--headless --no-sandbox --disable-dev-shm-usage"

      - name: Publish UI test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: target/surefire-reports/TEST-*.xml
          check_name: "UI Test Results"
          comment_mode: always

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure-screenshots
          path: target/screenshots/
          retention-days: 7

      - name: Upload UI Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-surefire-xml
          path: target/surefire-reports/
          retention-days: 14
