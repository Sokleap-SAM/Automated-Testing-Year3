<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Create account — My Cloud Drive</title>
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
<main class="card">
    <h1>Create your account</h1>
    <p class="welcome">Every account comes with 50 MB of free storage.</p>

    <p th:if="${param.error}" data-testid="signup-error" class="msg-err">
        That email is already registered.</p>

    <form method="post" action="/signup" class="auth-form">
        <label>Email
            <input type="email" name="email" data-testid="signup-email" required autofocus/>
        </label>
        <label>Password
            <input type="password" name="password" data-testid="signup-password" required/>
        </label>
        <button type="submit" data-testid="signup-btn">Create account</button>
    </form>

    <p class="switch">Already have an account? <a href="/login" data-testid="to-login">Sign in</a></p>
</main>
</body>
</html>
